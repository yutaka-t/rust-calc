<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUST RAID & CRAFT SIMULATOR</title>
  <style>
    /* リセットと基本設定 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      height: 100%;
      background-color: #121417;
    }
    body {
      min-height: 100vh;
      background-color: #121417;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      /* Discord iframe内で確実にスクロールさせる */
      overflow-y: auto !important;
      overflow-x: hidden;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    /* ヘッダー */
    .header {
      border-bottom: 2px solid #cd412b;
      padding-bottom: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-area h1 {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
    }
    .title-area p {
      font-size: 11px;
      color: #9ca3af;
    }
    button {
      background-color: #262a30;
      color: #e5e7eb;
      border: 1px solid #3f444e;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    button:hover { background-color: #32373f; }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background-color: #cd412b;
      border-color: #cd412b;
      color: #ffffff;
    }
    .btn-primary:hover { background-color: #b33622; }

    /* プリセット */
    .preset-box {
      background-color: #1a1d24;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #282d37;
      margin-bottom: 16px;
    }
    .preset-title {
      font-size: 11px;
      font-weight: bold;
      color: #9ca3af;
      margin-bottom: 8px;
    }
    .preset-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* レイアウト */
    .grid-layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 680px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    /* パネル共通 */
    .card {
      background-color: #1a1d24;
      border-radius: 6px;
      border: 1px solid #282d37;
      padding: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 16px;
      border-left: 3px solid #cd412b;
      padding-left: 8px;
    }

    /* 左カラム：入力フォーム */
    .weapon-select {
      margin-bottom: 16px;
    }
    .weapon-select label {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    select {
      width: 100%;
      background: #232730;
      border: 1px solid #3f444e;
      color: #ffffff;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }
    .target-row {
      background: #222630;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .target-info .name { font-size: 13px; font-weight: bold; }
    .target-info .hp { font-size: 11px; color: #9ca3af; }
    .counter {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .counter button {
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 16px;
      background: #2d323c;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .counter input {
      width: 48px;
      height: 32px;
      text-align: center;
      background: #14171c;
      border: 1px solid #3f444e;
      color: #ffffff;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
    }

    /* 右カラム：結果表示 */
    .res-section { margin-bottom: 20px; }
    .res-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #232731;
      font-size: 13px;
    }
    .res-row:last-child { border-bottom: none; }
    .res-row .lbl { color: #9ca3af; }
    .res-row .val { font-weight: bold; color: #ffffff; }
    .res-row .val.highlight { color: #38bdf8; font-size: 14px; }

    .sulfur-box {
      background: #2b130e;
      border: 1px solid #852a18;
      padding: 16px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sulfur-box .title { font-size: 13px; font-weight: bold; color: #fdba74; }
    .sulfur-box .amount { font-size: 20px; font-weight: 900; color: #f97316; }
