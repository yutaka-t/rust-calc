<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUST SIMULATOR Raid & Craft</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121417;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .header {
      border-bottom: 2px solid #cd412b;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-area h1 {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .title-area p {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      background-color: #262a30;
      color: #e5e7eb;
      border: 1px solid #3f444e;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      user-select: none;
    }
    button:hover {
      background-color: #32373f;
      border-color: #555c69;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #cd412b;
      border-color: #cd412b;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #b33622;
    }
    .preset-container {
      background-color: #1a1d24;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #282d37;
    }
    .preset-title {
      font-size: 12px;
      font-weight: bold;
      color: #9ca3af;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .preset-btn {
      font-size: 12px;
      padding: 6px 10px;
      background: #232730;
    }
    .main-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background-color: #1a1d24;
      border-radius: 8px;
      border: 1px solid #282d37;
      padding: 16px;
    }
    .card-title {
      font-size: 15px;
      font-weight: bold;
      color: #f3f4f6;
      margin-bottom: 12px;
      border-left: 3px solid #cd412b;
      padding-left: 8px;
    }
    .weapon-select-wrap {
      margin-bottom: 16px;
    }
    .weapon-select-wrap label {
      display: block;
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      background: #232730;
      border: 1px solid #3f444e;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .target-item {
      background: #222630;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .target-info .name {
      font-size: 14px;
      font-weight: bold;
    }
    .target-info .meta {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .counter {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .counter button {
      width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .counter input {
      width: 48px;
      height: 32px;
      text-align: center;
      background: #14171c;
      border: 1px solid #3f444e;
      color: #fff;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #282d37;
      font-size: 13px;
    }
    .result-row:last-child {
      border-bottom: none;
    }
    .result-row .res-name {
      color: #d1d5db;
    }
    .result-row .res-val {
      font-weight: bold;
      color: #fbbf24;
    }
    .total-sulfur {
      margin-top: 16px;
      background: #2d1810;
      border: 1px solid #7c2d12;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-sulfur .label {
      font-weight: bold;
      color: #fdba74;
      font-size: 14px;
    }
    .total-sulfur .val {
      font-size: 18px;
      font-weight: 800;
      color: #f97316;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-area">
      <h1>RUST RAID & CRAFT SIMULATOR</h1>
      <p>拠点破壊＆爆薬クラフト総素材計算ツール</p>
    </div>
    <div class="btn-group">
      <button id="btnReset">リセット</button>
      <button class="btn-primary" id="btnCopy">Discord用にコピー</button>
    </div>
  </div>

  <div class="preset-container">
    <div class="preset-title">クイックプリセット</div>
    <div class="presets">
      <button class="preset-btn" data-preset='{"garage": 2, "sheet": 1}'>🚪 ガレージ2枚 + 板金1枚 (小拠点)</button>
      <button class="preset-btn" data-preset='{"stone_wall": 2}'>🧱 石壁 2枚 (ハニカム貫通)</button>
      <button class="preset-btn" data-preset='{"armored": 1}'>🛡️ 装甲ドア 1枚 (最深部TC)</button>
    </div>
  </div>

  <div class="main-grid">
    <!-- 破壊目標選択 -->
    <div class="card">
      <div class="card-title">破壊目標の選択</div>
      
      <div class="weapon-select-wrap">
        <label for="mainWeapon">使用武器</label>
        <select id="mainWeapon">
