<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUST SIMULATOR Raid & Craft</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121417;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .header {
      border-bottom: 2px solid #cd412b;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-area h1 {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .title-area p {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      background-color: #262a30;
      color: #e5e7eb;
      border: 1px solid #3f444e;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover {
      background-color: #32373f;
      border-color: #555c69;
    }
    .btn-primary {
      background-color: #cd412b;
      border-color: #cd412b;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #b33622;
    }
    .preset-container {
      background-color: #1a1d24;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #282d37;
    }
    .preset-title {
      font-size: 12px;
      font-weight: bold;
      color: #9ca3af;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .preset-btn {
      font-size: 12px;
      padding: 6px 10px;
      background: #232730;
    }
    .main-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background-color: #1a1d24;
      border-radius: 8px;
      border: 1px solid #282d37;
      padding: 16px;
    }
    .card-title {
      font-size: 15px;
      font-weight: bold;
      color: #f3f4f6;
      margin-bottom: 12px;
      border-left: 3px solid #cd412b;
      padding-left: 8px;
    }
    .weapon-select-wrap {
      margin-bottom: 16px;
    }
    .weapon-select-wrap label {
      display: block;
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      background: #232730;
      border: 1px solid #3f444e;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .target-item {
      background: #222630;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .target-info .name {
      font-size: 14px;
      font-weight: bold;
    }
    .target-info .meta {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .counter {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .counter button {
      width: 28px;
      height: 28px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .counter input {
      width: 44px;
      height: 28px;
      text-align: center;
      background: #14171c;
      border: 1px solid #3f444e;
      color: #fff;
      border-radius: 4px;
      font-weight: bold;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #282d37;
      font-size: 13px;
    }
    .result-row:last-child {
      border-bottom: none;
    }
    .result-row .res-name {
      color: #d1d5db;
    }
    .result-row .res-val {
      font-weight: bold;
      color: #fbbf24;
    }
    .total-sulfur {
      margin-top: 16px;
      background: #2d1810;
      border: 1px solid #7c2d12;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-sulfur .label {
      font-weight: bold;
      color: #fdba74;
      font-size: 14px;
    }
    .total-sulfur .val {
      font-size: 18px;
      font-weight: 800;
      color: #f97316;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-area">
      <h1>RUST RAID & CRAFT SIMULATOR</h1>
      <p>拠点破壊＆爆薬クラフト総素材計算ツール</p>
    </div>
    <div class="btn-group">
      <button onclick="resetAll()">リセット</button>
      <button class="btn-primary" onclick="copyDiscord()">Discord用にコピー</button>
    </div>
  </div>

  <div class="preset-container">
    <div class="preset-title">クイックプリセット</div>
    <div class="presets">
      <button class="preset-btn" onclick="applyPreset({garage: 2, sheet: 1})">🚪 ガレージ2枚 + 板金1枚 (小拠点)</button>
      <button class="preset-btn" onclick="applyPreset({stone_wall: 2})">🧱 石壁 2枚 (ハニカム貫通)</button>
      <button class="preset-btn" onclick="applyPreset({armored: 1})">🛡️ 装甲ドア 1枚 (最深部TC)</button>
    </div>
  </div>

  <div class="main-grid">
    <!-- 破壊目標選択 -->
    <div class="card">
      <div class="card-title">破壊目標の選択</div>
      
      <div class="weapon-select-wrap">
        <label>使用武器</label>
        <select id="mainWeapon" onchange="calculate()">
          <option value="rocket">ロケット弾 主軸</option>
          <option value="c4">C4 主軸</option>
          <option value="satchel">サッチェル電荷 主軸</option>
          <option value="explo">炸裂弾（エクスプローシブ）主軸</option>
        </select>
      </div>

      <div class="target-item">
        <div class="target-info">
          <div class="name">木のドア</div>
          <div class="meta">200 HP</div>
        </div>
        <div class="counter">
          <button onclick="changeVal('wood_door', -1)">-</button>
          <input type="number" id="wood_door" value="0" min="0" onchange="calculate()">
          <button onclick="changeVal('wood_door', 1)">+</button>
        </div>
      </div>

      <div class="target-item">
        <div class="target-info">
          <div class="name">板金ドア</div>
          <div class="meta">250 HP</div>
        </div>
        <div class="counter">
          <button onclick="changeVal('sheet', -1)">-</button>
          <input type="number" id="sheet" value="0" min="0" onchange="calculate()">
          <button onclick="changeVal('sheet', 1)">+</button>
        </div>
      </div>

      <div class="target-item">
        <div class="target-info">
          <div class="name">ガレージドア</div>
          <div class="meta">600 HP</div>
        </div>
        <div class="counter">
          <button onclick="changeVal('garage', -1)">-</button>
          <input type="number" id="garage" value="0" min="0" onchange="calculate()">
          <button onclick="changeVal('garage', 1)">+</button>
        </div>
      </div>

      <div class="target-item">
        <div class="target-info">
          <div class="name">装甲ドア</div>
          <div class="meta">800 HP</div>
        </div>
        <div class="counter">
          <button onclick="changeVal('armored', -1)">-</button>
          <input type="number" id="armored" value="0" min="0" onchange="calculate()">
          <button onclick="changeVal('armored', 1)">+</button>
        </div>
      </div>

      <div class="target-item">
        <div class="target-info">
          <div class="name">石壁 / 石天井</div>
          <div class="meta">500 HP</div>
        </div>
        <div class="counter">
          <button onclick="changeVal('stone_wall', -1)">-</button>
          <input type="number" id="stone_wall" value="0" min="0" onchange="calculate()">
          <button onclick="changeVal('stone_wall', 1)">+</button>
        </div>
      </div>
    </div>

    <!-- 必要弾薬 & 素材計算結果 -->
    <div class="card">
      <div class="card-title">必要弾薬</div>
      <div id="ammoResults">
        <div class="result-row"><span class="res-name">選択された武器数</span><span class="res-val" id="resAmmo">0</span></div>
      </div>

      <div class="card-title" style="margin-top: 24px;">必要原材料（生素材）</div>
      <div class="result-row"><span class="res-name">硫黄（Sulfur）</span><span class="res-val" id="resSulfur">0</span></div>
      <div class="result-row"><span class="res-name">木炭（Charcoal）</span><span class="res-val" id="resCharcoal">0</span></div>
      <div class="result-row"><span class="res-name">金属片（Metal Frags）</span><span class="res-val" id="resFrags">0</span></div>
      <div class="result-row"><span class="res-name">上質金属（HQM）</span><span class="res-val" id="resHqm">0</span></div>
      <div class="result-row"><span class="res-name">パイプ（Pipes）</span><span class="res-val" id="resPipes">0</span></div>

      <div class="total-sulfur">
        <span class="label">総硫黄コスト:</span>
        <span class="val" id="totalSulfurBadge">0</span>
      </div>
    </div>
  </div>

  <script>
    // 目標ごとの耐久コスト表 [rocket, c4, satchel, 5.56explo]
    const COSTS = {
      wood_door:   { rocket: 1,  c4: 1, satchel: 2,  explo: 18 },
      sheet:       { rocket: 2,  c4: 1, satchel: 4,  explo: 63 },
      garage:      { rocket: 3,  c4: 2, satchel: 9,  explo: 150 },
      armored:     { rocket: 4,  c4: 2, satchel: 12, explo: 200 },
      stone_wall:  { rocket: 4,  c4: 2, satchel: 10, explo: 185 }
    };

    // 武器1つあたりの生素材コスト (火薬1=硫黄2+木炭3, 爆薬1=火薬50+硫黄10+低質10+鉄10)
    const WEAPON_RAW = {
      rocket:  { sulfur: 1400, charcoal: 1950, frags: 100, hqm: 2, pipes: 2 },
      c4:      { sulfur: 2200, charcoal: 3000, frags: 200, hqm: 0, pipes: 0 },
      satchel: { sulfur: 480,  charcoal: 720,  frags: 80,  hqm: 0, pipes: 0 },
      explo:   { sulfur: 25,   charcoal: 30,   frags: 5,   hqm: 0, pipes: 0 } // 1発あたり
    };

    function changeVal(id, delta) {
      const el = document.getElementById(id);
      let v = parseInt(el.value) || 0;
      v = Math.max(0, v + delta);
      el.value = v;
      calculate();
    }

    function applyPreset(data) {
      resetAll(false);
      for (const [k, v] of Object.entries(data)) {
        const el = document.getElementById(k);
        if (el) el.value = v;
      }
      calculate();
    }

    function resetAll(triggerCalc = true) {
      ['wood_door', 'sheet', 'garage', 'armored', 'stone_wall'].forEach(id => {
        document.getElementById(id).value = 0;
      });
      if (triggerCalc) calculate();
    }

    function calculate() {
      const weapon = document.getElementById('mainWeapon').value;
      let totalAmmo = 0;

      for (const [key, costMap] of Object.entries(COSTS)) {
        const count = parseInt(document.getElementById(key).value) || 0;
        totalAmmo += count * costMap[weapon];
      }

      const raw = WEAPON_RAW[weapon];
      const s = totalAmmo * raw.sulfur;
      const c = totalAmmo * raw.charcoal;
      const f = totalAmmo * raw.frags;
      const h = totalAmmo * raw.hqm;
      const p = totalAmmo * raw.pipes;

      const weaponNames = { rocket: 'ロケット弾', c4: 'C4', satchel: 'サッチェル', explo: '炸裂弾' };
      document.getElementById('resAmmo').textContent = `${totalAmmo} 発 (${weaponNames[weapon]})`;
      document.getElementById('resSulfur').textContent = s.toLocaleString();
      document.getElementById('resCharcoal').textContent = c.toLocaleString();
      document.getElementById('resFrags').textContent = f.toLocaleString();
      document.getElementById('resHqm').textContent = h.toLocaleString();
      document.getElementById('resPipes').textContent = p.toLocaleString();
      document.getElementById('totalSulfurBadge').textContent = `${s.toLocaleString()} 硫黄`;
    }

    function copyDiscord() {
      const weapon = document.getElementById('mainWeapon').value;
      const weaponNames = { rocket: 'ロケット弾', c4: 'C4', satchel: 'サッチェル', explo: '炸裂弾' };
      const ammo = document.getElementById('resAmmo').textContent;
      const sulfur = document.getElementById('resSulfur').textContent;
      const charcoal = document.getElementById('resCharcoal').textContent;

      const text = `【レイド素材計算】\n主軸: ${ammo}\n必要硫黄: ${sulfur} / 木炭: ${charcoal}`;
      navigator.clipboard.writeText(text).then(() => {
        alert('Discord用テキストをクリップボードにコピーしました！');
      });
    }

    calculate();
  </script>
</body>
</html>
